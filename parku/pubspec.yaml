name: parku
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.2
  google_maps_flutter: ^2.18.1
  fl_chart: ^1.2.0
  geolocator: ^14.0.3
  path_provider: ^2.1.6
  sqflite: ^2.4.5
  path: ^1.9.1
  http: ^1.6.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.5
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  shared_preferences_web: ^2.4.3
  file: ^7.0.1
  sqflite_common_ffi: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
